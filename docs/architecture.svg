<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">CTI-Tool architecture</title>
  <desc id="desc">Offline DNRTI model training feeds a runtime external CTI pipeline that produces normalized CTI objects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f2438"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55d6be"/>
    </marker>
    <style>
      .title{font:700 30px 'Segoe UI',sans-serif;fill:#f5fbff}.subtitle{font:400 16px 'Segoe UI',sans-serif;fill:#9db6c9}.label{font:600 17px 'Segoe UI',sans-serif;fill:#effbff;text-anchor:middle}.small{font:400 13px 'Segoe UI',sans-serif;fill:#b8cedd;text-anchor:middle}.box{fill:#132f46;stroke:#2c5670;stroke-width:2;rx:16}.accent{fill:#123d43;stroke:#3fc7b1;stroke-width:2;rx:16}.line{stroke:#55d6be;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <text class="title" x="70" y="62">CTI-Tool</text>
  <text class="subtitle" x="70" y="92">Evidence-led architecture with a clear training/runtime boundary</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="150" width="240" height="110"/>
    <text class="label" x="190" y="195">External Sources</text>
    <text class="small" x="190" y="225">Advisories · NVD · Articles</text>
    <rect class="box" x="380" y="150" width="240" height="110"/>
    <text class="label" x="500" y="195">Normalize &amp; Deduplicate</text>
    <text class="small" x="500" y="225">Source-independent records</text>
    <rect class="box" x="690" y="150" width="240" height="110"/>
    <text class="label" x="810" y="195">Classify &amp; Extract</text>
    <text class="small" x="810" y="225">NER · IoCs · Relationships</text>
    <rect class="accent" x="1000" y="150" width="330" height="110"/>
    <text class="label" x="1165" y="195">Normalized CTI Objects</text>
    <text class="small" x="1165" y="225">Provenance · Confidence · Status</text>
    <rect class="box" x="535" y="340" width="300" height="110"/>
    <text class="label" x="685" y="385">Offline DNRTI Training</text>
    <text class="small" x="685" y="415">Evaluated NER model artifacts</text>
  </g>
  <path class="line" d="M310 205 H370"/>
  <path class="line" d="M620 205 H680"/>
  <path class="line" d="M930 205 H990"/>
  <path class="line" d="M835 395 C930 395 930 280 930 280"/>
</svg>
